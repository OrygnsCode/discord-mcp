# Build and test on every push and pull request. This runs the same
# suite that gates local commits: compile, pure-logic unit tests, a full
# stdio protocol session, and the HTTP transport with its security
# gates. None of it needs a Discord token; the live acceptance suite
# stays out of CI on purpose because it requires a real test server.
#
# Ubuntu covers Node 22 (the minimum supported) and 24 (current LTS). One Windows leg and one macOS leg cover the platform-specific
# paths: the wizard's client config detection, file handling, and
# process spawning behave differently enough there to be worth the
# runners.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24]
        include:
          - os: windows-latest
            node: 24
          - os: macos-latest
            node: 24
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: node scripts/unit.mjs

      - name: Protocol smoke test (2025-era clients)
        run: node scripts/smoke.mjs

      - name: Protocol smoke test (2026-07-28 clients)
        run: node scripts/smoke-modern.mjs

      - name: Confirmation dialog smoke test
        run: node scripts/smoke-dialog.mjs

      - name: HTTP transport smoke test
        run: node scripts/smoke-http.mjs

      # Once, not per platform: the Claude Desktop bundle the release
      # attaches, built and validated from this commit.
      - name: Claude Desktop bundle builds
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: node scripts/build-mcpb.mjs "$RUNNER_TEMP/discord-mcp.mcpb"

      # The usage stats receiver (telemetry/), on a local copy of Cloudflare's
      # runtime and database, including a report from the client just built.
      - name: Usage stats receiver tests
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        working-directory: telemetry
        run: |
          npm ci
          npm test

      # The container image: builds, refuses to start without an HTTP token,
      # answers over MCP, and can write its data folder with no volume.
      - name: Docker image smoke test
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: node scripts/smoke-docker.mjs
