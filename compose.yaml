# Example deployment. Set DISCORD_TOKEN and DISCORD_MCP_HTTP_TOKEN in the
# shell or an env file before bringing it up; the container refuses to
# start without the HTTP token because it binds beyond loopback.
services:
  discord-mcp:
    build: .
    ports:
      - "3414:3414"
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_MCP_GUILD: ${DISCORD_MCP_GUILD:-}
      DISCORD_MCP_HTTP_TOKEN: ${DISCORD_MCP_HTTP_TOKEN}
    # Build plans, change records (for undo), saved blueprints, and scheduled
    # messages, kept when the container is replaced by a newer image.
    volumes:
      - discord-mcp-data:/app/.discord-mcp
    restart: unless-stopped

volumes:
  discord-mcp-data:
