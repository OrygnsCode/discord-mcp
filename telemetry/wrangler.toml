# The receiver for discord-mcp's usage stats. See src/worker.js.
name = "discord-mcp-telemetry"
main = "src/worker.js"
compatibility_date = "2025-11-01"
workers_dev = false

routes = [
  { pattern = "telemetry.orygn.tech", custom_domain = true },
]

[[d1_databases]]
binding = "DB"
database_name = "discord-mcp-telemetry"
database_id = "31a13a35-1dcf-4f49-b70f-8455fbaf6c96"
migrations_dir = "migrations"

# Caps how many reports one address can have counted per minute, far above
# what an install sends (one a day). The address is only the limiter's key.
[[ratelimits]]
name = "PING_LIMIT"
namespace_id = "2101"

  [ratelimits.simple]
  limit = 30
  period = 60

# Daily: forget report numbers after three days, the log after seven.
[triggers]
crons = ["23 3 * * *"]

# Keeps what the Worker logs itself (failures) for a few days. Per-request
# logs are off.
[observability]
enabled = true

[observability.logs]
invocation_logs = false
